name: Release

# v1.4.0 gibi bir etiket gönderildiğinde Rebornix.exe'yi derler,
# SHA256 özetini hesaplar ve ikisini de GitHub sürümüne yükler.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test -c Release
      - name: Tek dosya exe üret
        run: >
          dotnet publish src/Rebornix/Rebornix.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: SHA256 hesapla
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/Rebornix.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Rebornix.exe" | Out-File -Encoding ascii publish/Rebornix.exe.sha256
      - name: Sürüme yükle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag publish/Rebornix.exe publish/Rebornix.exe.sha256 --clobber
          } else {
            gh release create $tag publish/Rebornix.exe publish/Rebornix.exe.sha256 --title "Rebornix $tag" --generate-notes
          }
