<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1016"/>
      <stop offset="1" stop-color="#191D29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#93C5FD"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5AA9FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5AA9FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="28" fill="url(#grid)"/>
  <circle cx="250" cy="120" r="260" fill="url(#glow1)"/>
  <circle cx="1120" cy="360" r="300" fill="url(#glow2)"/>

  <!-- Logo -->
  <g transform="translate(120,110) scale(2.8)">
    <rect width="64" height="64" rx="17" fill="url(#accent)"/>
    <rect width="64" height="64" rx="17" fill="url(#shine)"/>
    <path d="M 47.43,13.62 A 24,24 0 1 1 16.57,13.62" fill="none" stroke="#FFF" stroke-opacity="0.85" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M 20.78,10.08 L 18.51,18.26 L 12.34,10.91 Z" fill="#FFF" fill-opacity="0.85"/>
    <path d="M 25,44 V 20 H 33 A 7,7 0 0 1 33,34 H 25 M 32,34 L 40,44" fill="none" stroke="#FFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="345" y="185" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" fill="url(#title)" letter-spacing="-2">Rebornix</text>
  <text x="349" y="238" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#C9CEDD">Back up before you reinstall. Restore in one click.</text>

  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF">
    <rect x="349" y="276" width="140" height="40" rx="20" fill="#7C5CFF" fill-opacity="0.25" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <text x="419" y="302" text-anchor="middle">Drivers</text>
    <rect x="501" y="276" width="110" height="40" rx="20" fill="#7C5CFF" fill-opacity="0.25" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <text x="556" y="302" text-anchor="middle">Wi-Fi</text>
    <rect x="623" y="276" width="150" height="40" rx="20" fill="#7C5CFF" fill-opacity="0.25" stroke="#7C5CFF" stroke-opacity="0.6"/>
    <text x="698" y="302" text-anchor="middle">Apps</text>
    <rect x="785" y="276" width="150" height="40" rx="20" fill="#5AA9FF" fill-opacity="0.22" stroke="#5AA9FF" stroke-opacity="0.6"/>
    <text x="860" y="302" text-anchor="middle">Game saves</text>
    <rect x="947" y="276" width="190" height="40" rx="20" fill="#5AA9FF" fill-opacity="0.22" stroke="#5AA9FF" stroke-opacity="0.6"/>
    <text x="1042" y="302" text-anchor="middle">Windows settings</text>
  </g>
</svg>
